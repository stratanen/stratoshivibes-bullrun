<style>

<style>
/* Layout: full-screen portrait racer. Canvas world underneath; glass HUD on top, thumb pads at the bottom corners. One committed dusk-arcade look (dark only). */
:root{
  --bg:#0b0820;
  --ink:#fbf8ff;
  --dim:#c3bce6;
  --mute:#8f88bb;
  --glass:rgba(14,10,38,.5);
  --glass-on:rgba(255,255,255,.2);
  --line:rgba(255,255,255,.22);
  --sol-a:#a35cff;
  --sol-b:#14f0a0;
  --hot:#ff3a5c;
  --cyan:#3fe6ff;
  --gold:#ffc24a;
  --fd:"Saira","Arial Narrow",Arial,sans-serif;
  --fb:"Commissioner",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 var(--fb);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
button{font:inherit;color:inherit}
.num{font-family:var(--fd);font-style:italic;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lab{font:800 10px/1 var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:2;pointer-events:none;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;text-shadow:0 2px 12px rgba(10,6,30,.6)}
.hud .col{display:flex;flex-direction:column;gap:5px;min-width:0}
.hud .r{align-items:flex-end;text-align:right}
.hud .big{font-size:28px;line-height:.95;white-space:nowrap}
.hud .big small{font:800 12px var(--fb);font-style:normal;color:var(--dim);margin-left:3px;letter-spacing:.06em}
.tok{display:flex;align-items:center;gap:6px;font-size:20px}
.tok svg{width:20px;height:20px;flex:none;filter:drop-shadow(0 0 6px rgba(163,92,255,.7))}
.time{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.time .num{font-size:52px;line-height:.9;text-shadow:0 0 22px rgba(255,90,140,.55),0 2px 12px rgba(10,6,30,.6)}
.time.low .num{color:#ff5a6e;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.spdbar{width:96px;height:8px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
.spdbar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--cyan),#fff 70%,var(--hot))}
.pausebtn{position:fixed;z-index:4;left:max(16px, env(safe-area-inset-left, 0px));top:calc(env(safe-area-inset-top, 0px) + 92px);
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pausebtn svg{width:16px;height:16px;fill:var(--ink)}

/* messages */
.flash{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;text-align:center;opacity:0;white-space:nowrap}
.flash b{display:block;font:italic 900 34px/1 var(--fd);letter-spacing:.01em;color:#fff;text-shadow:0 0 18px rgba(63,230,255,.8),0 3px 14px rgba(10,6,30,.6)}
.flash small{display:block;margin-top:6px;font:800 14px var(--fb);letter-spacing:.08em;color:var(--sol-b);text-shadow:0 2px 10px rgba(10,6,30,.7)}
.flash.warm b{text-shadow:0 0 18px rgba(255,90,140,.9),0 3px 14px rgba(10,6,30,.6)}
.flash.show{animation:fl 1.7s ease-out both}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.85)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}78%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-75%)}}
.count{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;font:italic 900 110px/1 var(--fd);color:#fff;text-shadow:0 0 30px rgba(255,79,216,.8),0 6px 20px rgba(10,6,30,.5)}
.count.pop{animation:pop .9s ease-out both}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}

/* touch pads */
.pad{position:fixed;left:0;right:0;bottom:0;z-index:3;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px))}
.pad>*{pointer-events:auto}
.steer{display:flex;width:min(46vw,200px);height:88px;border-radius:24px;background:var(--glass);border:1px solid var(--line);overflow:hidden;touch-action:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.steer span{flex:1;display:grid;place-items:center;transition:background .08s}
.steer span+span{border-left:1px solid var(--line)}
.steer span.on{background:var(--glass-on)}
.steer svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.pedals{display:flex;gap:10px;align-items:flex-end}
.ped{width:64px;height:88px;border-radius:18px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .08s,transform .08s}
.ped.gas{height:104px}
.ped svg{width:26px;height:34px}
.ped small{font:800 10px var(--fb);letter-spacing:.14em;color:var(--dim)}
.ped.on{background:var(--glass-on);transform:scale(.96)}
.ped.gas.on{box-shadow:0 0 0 2px var(--sol-b) inset}
.ped.brake.on{box-shadow:0 0 0 2px var(--hot) inset}
.nitro{width:138px;height:44px;border-radius:14px;border:1px solid rgba(63,230,255,.5);background:rgba(10,30,60,.55);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nitro b{font:italic 900 16px var(--fd);letter-spacing:.06em;color:#fff}
.nitro .pips{display:flex;gap:4px}
.nitro .pips u{width:9px;height:16px;border-radius:2px;background:rgba(255,255,255,.18);transform:skewX(-14deg)}
.nitro .pips u.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.nitro.ready{box-shadow:0 0 16px rgba(63,230,255,.45)}
.nitro.active{background:rgba(63,230,255,.35)}
.nitro:disabled{opacity:.55}
.nitro.fly{border-color:rgba(230,251,255,.6);background:rgba(40,50,80,.55);margin-bottom:8px}
.nitro.fly .pips u.on{background:#e6fbff;box-shadow:0 0 8px #b9f3ff}
.nitro.fly.ready{box-shadow:0 0 16px rgba(185,243,255,.5)}
.nitro.fly.active{background:rgba(185,243,255,.35)}

/* menus */
.menu{position:fixed;inset:0;z-index:5;overflow-y:auto;display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(180deg,rgba(11,8,32,.25) 0%,rgba(11,8,32,.72) 45%,rgba(11,8,32,.92) 100%)}
.card{width:min(100%, 380px);display:flex;flex-direction:column;gap:14px}
.eyebrow{font:800 11px var(--fb);letter-spacing:.34em;color:var(--cyan)}
.title{margin:0;font:italic 900 clamp(64px, 22vw, 92px)/.82 var(--fd);letter-spacing:-.02em;text-wrap:balance;
  background:linear-gradient(180deg,#fff 0%,#ffe2a0 38%,#ff8a52 62%,#ff3a8a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,80,140,.45))}
.tag{margin:0;color:var(--dim);font-size:15px;line-height:1.45;text-wrap:pretty}
.rules{list-style:none;margin:0;padding:12px 14px;display:grid;gap:9px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.4;color:var(--ink)}
.rules svg{width:22px;height:22px;margin-top:-1px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;font:700 13px var(--fb);color:var(--dim);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#150d34}
.go{border:0;border-radius:16px;padding:16px 20px;cursor:pointer;font:italic 900 22px var(--fd);letter-spacing:.04em;color:#140b2c;
  background:linear-gradient(90deg,#ffd27a,#ff8a52 45%,#ff3a8a);box-shadow:0 6px 26px rgba(255,90,120,.45)}
.go.alt{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1px solid var(--line);font-size:17px}
.go:focus-visible,.seg button:focus-visible,.pausebtn:focus-visible,.nitro:focus-visible{outline:2px solid #fff;outline-offset:3px}
.meta{margin:0;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.proto{margin:0;font-size:12px;color:var(--mute)}
.res{font:italic 900 64px/.9 var(--fd);font-variant-numeric:tabular-nums}
.res small{font:800 18px var(--fb);font-style:normal;color:var(--dim);margin-left:6px}
.chip{align-self:flex-start;font:800 11px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:#120b2a;background:var(--sol-b);padding:5px 10px;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.stats b{font:italic 900 24px/1 var(--fd);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
.ol,.or{display:flex;flex-direction:column;gap:14px;min-width:0}
.row .go{flex:1}
@media (prefers-reduced-motion: reduce){.flash.show,.count.pop,.time.low .num{animation-duration:.01s}}

/* screens */
.card.wide{width:min(100%, 640px)}
.bar{display:flex;align-items:center;gap:12px;min-height:44px}
.bar h2{margin:0;flex:1;font:italic 900 28px/1 var(--fd);letter-spacing:.01em}
.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:20px;height:20px;color:var(--ink)}
.bank{display:inline-flex;align-items:center;gap:6px;font-size:20px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07)}
.bank svg{width:18px;height:18px;color:var(--gold);fill:currentColor}
.mainbtns{display:grid;gap:10px}
.mainbtns .go{display:flex;align-items:baseline;justify-content:space-between;gap:12px;text-align:left}
.mainbtns .go small{font:800 13px var(--fb);font-style:normal;opacity:.75;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);cursor:pointer;font:700 12px var(--fb);color:var(--ink);min-width:0}
.tile svg{width:24px;height:24px;color:var(--ink)}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(10,8,30,.4);cursor:pointer;font:700 13px var(--fb);color:var(--ink)}
.wbtn svg{width:16px;height:16px;flex:none}
.wbtn small{color:var(--dim);font-weight:600}
.wbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--sol-b);box-shadow:0 0 8px var(--sol-b)}
.tlist{display:grid;gap:16px}
.mkt h3{margin:0 0 8px;display:flex;align-items:center;gap:8px;font:800 11px var(--fb);letter-spacing:.2em;color:var(--dim)}
.mkt h3 i{width:10px;height:10px;border-radius:3px;display:block}
.trow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trk{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);cursor:pointer;text-align:left;min-width:0;color:var(--ink)}
.trk b{font:italic 900 15px/1.1 var(--fd);letter-spacing:.01em;text-wrap:balance;hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.trk .n{font:italic 900 12px var(--fd);color:var(--dim)}
.trk .sm{font:600 11.5px var(--fb);color:var(--dim);font-variant-numeric:tabular-nums}
.trk .st{display:flex;gap:2px}
.trk .st svg{width:15px;height:15px;fill:rgba(255,255,255,.18)}
.trk .st svg.on{fill:var(--gold);filter:drop-shadow(0 0 4px rgba(255,194,74,.6))}
.trk:disabled{cursor:default;opacity:.5}
.trk .lk{position:absolute;top:10px;right:10px;width:16px;height:16px;color:var(--dim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  padding:0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px))}
.sheetcard{width:min(100%, 520px);display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:24px;background:rgba(12,9,34,.82);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gname{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.gname b{font:italic 900 22px var(--fd)}
.gname span{font:600 12.5px var(--fb);color:var(--dim)}
.paints{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.sw{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;border:2px solid transparent;cursor:pointer;padding:0;overflow:hidden;box-shadow:inset 0 -10px 18px rgba(0,0,0,.28)}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),inset 0 -10px 18px rgba(0,0,0,.28)}
.sw .lk{position:absolute;inset:auto 4px 4px auto;width:15px;height:15px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.sw .eq{position:absolute;inset:4px auto auto 4px;width:9px;height:9px;border-radius:50%;background:var(--sol-b);box-shadow:0 0 6px var(--sol-b)}
.go:disabled{opacity:.55;cursor:default}
.dlg{z-index:7;background:rgba(6,4,20,.72)}
.dlg .card{background:rgba(16,12,42,.96);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:18px;max-height:calc(100% - 20px);overflow-y:auto}
.dlg h2{margin:0;font:italic 900 26px/1.05 var(--fd)}
.dlg p{margin:0;color:var(--dim);line-height:1.5;font-size:14px}
.dlg p b{color:var(--ink)}
.fine{font-size:12px!important;color:var(--mute)!important}
.serr{color:#ff8fa0!important}
.btn2{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;cursor:pointer;font:700 14px var(--fb);color:var(--ink)}
.wbtns{display:flex;flex-wrap:wrap;gap:8px}
.wbtns>*{flex:1 1 auto}
.wlist{display:grid;gap:8px}
.witem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;text-align:left;color:var(--ink);font:700 14px var(--fb)}
.witem img{width:32px;height:32px;border-radius:8px}
.witem small{display:block;font-weight:600;color:var(--dim);font-size:12px}
.waddr{font:600 12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;padding:10px;border-radius:12px;background:rgba(255,255,255,.06)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 11px;font:700 12.5px var(--fb);color:var(--dim);cursor:pointer}
.tabs button.on{background:var(--ink);color:#150d34;border-color:var(--ink)}
.lblist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.lblist li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13.5px}
.lblist li.me{background:rgba(20,240,160,.16)}
.lblist .r{color:var(--dim);font-weight:800}
.lblist .s{font:italic 900 15px var(--fd)}
.sitem{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.06)}
.sitem .ic{display:flex;gap:3px;align-items:center}
.sitem .ic i{width:16px;height:30px;border-radius:5px;display:block}
.sitem .ds{font-size:13px;color:var(--dim);line-height:1.45;margin-top:2px}
.sitem .rw{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pr{font:italic 900 18px var(--fd)}
.own{font:800 12px var(--fb);color:var(--sol-b)}
.sbuy{border:0;border-radius:12px;padding:9px 16px;font:800 14px var(--fb);color:#140b2c;background:linear-gradient(90deg,#ffd27a,#ff8a52 45%,#ff3a8a);cursor:pointer}
.scur{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.scur button{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:9px 6px;cursor:pointer;color:var(--ink);font:800 14px var(--fb);display:flex;flex-direction:column;align-items:center;gap:2px}
.scur button small{font-weight:600;font-size:11px;color:var(--dim)}
.scur button .disc{color:var(--sol-b)}
.scur button.on{border-color:#fff;background:rgba(255,255,255,.14)}
.ssum{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05)}
.ssum span{color:var(--dim)}
.ssum b{text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
.ssum a{color:var(--cyan)}
.sok{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--dim);line-height:1.45}
.sok input{margin-top:3px;width:18px;height:18px;flex:none}
.sspin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--cyan);animation:spin .8s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);transform:translateX(-50%);z-index:9;max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:rgba(16,12,42,.95);border:1px solid var(--line);font:700 13.5px var(--fb);text-align:center}
.toast small{display:block;font-weight:600;color:var(--dim)}
.stars{display:flex;gap:6px}
.stars svg{width:44px;height:44px;fill:rgba(255,255,255,.14)}
.stars svg.on{fill:var(--gold);filter:drop-shadow(0 0 10px rgba(255,194,74,.7));animation:starpop .45s ease-out both}
.stars svg:nth-child(2).on{animation-delay:.18s}.stars svg:nth-child(3).on{animation-delay:.36s}
@keyframes starpop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font:600 12px var(--fb);color:var(--dim);font-variant-numeric:tabular-nums}
.goals span{display:flex;align-items:center;gap:4px}
.goals svg{width:12px;height:12px;fill:var(--gold)}
.time .target{font:800 11px var(--fb);color:var(--gold);letter-spacing:.06em;min-height:14px;display:flex;align-items:center;gap:3px}
.time .target svg{width:11px;height:11px;fill:var(--gold)}
.prog{width:96px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.prog i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:var(--gold)}
.rules svg{width:22px;height:22px;margin-top:-1px}
.proto a{color:var(--dim)}
h3.lab{margin:4px 0 0}
.tile:focus-visible,.trk:focus-visible,.sw:focus-visible,.back:focus-visible,.wbtn:focus-visible,.btn2:focus-visible,.tabs button:focus-visible,.sbuy:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (orientation: landscape) and (max-height: 560px){
  .card.home{width:min(100%, 820px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;row-gap:12px;align-items:start;
    grid-template-areas:"eb main" "ti main" "ti tiles" "perk wallet" "tag meta"}
  .home .perkcard{grid-area:perk}
  .home .eyebrow{grid-area:eb} .home .title{grid-area:ti;font-size:clamp(44px, 17vh, 80px)} .home .tag{grid-area:tag;font-size:14px}
  .home .mainbtns{grid-area:main;display:grid;grid-template-columns:1fr 1fr;gap:10px} .home .tiles{grid-area:tiles}
  .home .mainbtns .go{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:12px 14px;font-size:17px;min-height:74px}
  .home .mainbtns .go>small{font-size:11px} .home .wbtn{grid-area:wallet} .home .meta{grid-area:meta}
  .card.wide{width:min(100%, 860px)}
  .tlist{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .trow{grid-template-columns:1fr}
  .trk{padding:9px 11px}
  .sheet{justify-content:flex-end}
  .sheetcard{width:min(48%, 440px)}
  #over .card{width:min(100%, 760px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;align-items:center}
  #over .res{font-size:52px}
  .rules li{font-size:13px}
  .pausebtn{top:calc(env(safe-area-inset-top, 0px) + 78px)}
  .ped{height:76px}.ped.gas{height:88px}.steer{height:76px}
}
@media (max-width: 480px) and (orientation: portrait){
  .hud .big{font-size:24px}.hud .big small{font-size:11px}.tiles{gap:6px}
  .tlist{gap:12px}
  .trow{grid-template-columns:1fr;gap:6px}
  .trk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:center;padding:10px 12px}
  .trk .n{grid-row:1 / 3;font-size:16px}
  .trk b{grid-column:2;font-size:16px;hyphens:none;overflow-wrap:normal}
  .trk .sm{grid-column:2}
  .trk .st{grid-column:3;grid-row:1 / 3}
  .trk .lk{position:static;grid-column:3;grid-row:1 / 3;width:18px;height:18px}
  .trk:disabled .st{display:none}
}
.go.chase{background:linear-gradient(90deg,#ff2340,#ff8a2a);color:#1a0608;box-shadow:0 6px 22px rgba(255,35,64,.32);font-size:20px;align-items:center}
.go.chase .dn{display:flex;flex-direction:column;gap:2px}.go.chase .dn>span{white-space:nowrap}
.go.chase .dn small{font:800 11.5px var(--fb);font-style:normal;opacity:.75;letter-spacing:.04em}
.go.chase>small{font:800 12px var(--fb);font-style:normal;opacity:.8}
.liqglow{position:fixed;left:0;right:0;bottom:0;height:34vh;pointer-events:none;z-index:3;opacity:0;transition:opacity .3s;
 background:radial-gradient(60% 100% at 30% 100%,rgba(255,35,64,.45),transparent 70%),radial-gradient(60% 100% at 70% 100%,rgba(255,174,42,.38),transparent 70%)}
.liqglow.on{opacity:1;animation:liqp .42s steps(2) infinite}
@keyframes liqp{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(-40deg)}}
@media (prefers-reduced-motion:reduce){.liqglow.on{animation:none}}
.hud.chase #hTime{letter-spacing:.12em;color:#ffd0d6}
.go.day{background:linear-gradient(90deg,#3fe6ff,#14f0a0);box-shadow:0 6px 22px rgba(20,240,160,.3);font-size:20px;align-items:center}
.go.day .dn>span{white-space:nowrap}
#dailyInfo{white-space:nowrap}
.go.day .dn{display:flex;flex-direction:column;gap:2px}
.go.day .dn small{font:800 11.5px var(--fb);font-style:normal;opacity:.7;letter-spacing:.04em}
.bonus{margin:0;font:italic 900 20px var(--fd);color:var(--sol-b)}

/* big steering zone: the whole lower-left of the screen. Left half of the zone steers left, right half steers right. */
.steer{position:fixed;left:0;bottom:0;width:58vw;height:62vh;max-width:none;display:flex;background:none;border:0;border-radius:0;overflow:visible;z-index:3;
  padding:0 0 calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));backdrop-filter:none;-webkit-backdrop-filter:none}
.steer span{flex:1;display:flex;align-items:flex-end;justify-content:center;position:relative;transition:none}
.steer span+span{border-left:0}
.steer span::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .08s;pointer-events:none}
.steer span::before{background:radial-gradient(ellipse 50% 65% at 50% 100%,rgba(63,230,255,.3),rgba(63,230,255,0))}
.steer span.on::before{opacity:1}
.steer span.on{background:none}
.steer svg{width:34px;height:34px;padding:19px;box-sizing:content-box;border-radius:50%;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .08s,background .08s}
.steer span.on svg{background:rgba(63,230,255,.35);border-color:rgba(63,230,255,.8);transform:scale(1.08)}
.steer::after{content:"";position:absolute;left:calc(50% + max(8px, env(safe-area-inset-left, 0px)) / 2);bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);width:1px;height:56px;background:var(--line)}
.rcol{margin-left:auto}
.ped{width:76px;height:104px}.ped.gas{width:84px;height:124px}
@media (orientation: landscape) and (max-height: 560px){
  .steer{width:46vw;height:78vh}
  .steer svg{width:30px;height:30px;padding:16px}
  .ped{height:84px}.ped.gas{height:100px}
}
.tiltind{position:fixed;left:max(24px, env(safe-area-inset-left, 0px) + 8px);bottom:calc(env(safe-area-inset-bottom, 0px) + 34px);width:150px;height:10px;border-radius:5px;background:var(--glass);border:1px solid var(--line);pointer-events:none}
.tiltind::after{content:"";position:absolute;left:50%;top:-4px;width:1px;height:16px;background:var(--line)}
.tiltind i{position:absolute;left:calc(50% - 9px);top:-5px;width:18px;height:18px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);transform:translateX(0);will-change:transform}
.perkcard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;cursor:pointer;color:var(--ink);text-align:left;
  border:1px solid rgba(97,245,196,.45);background:linear-gradient(100deg,rgba(18,88,79,.65),rgba(14,10,38,.55));font:inherit}
.perkcard b{display:block;font:italic 900 17px/1.1 var(--fd);letter-spacing:.02em}
.perkcard small{display:block;font:700 11.5px var(--fb);color:#9be9cf;letter-spacing:.04em}
.perkcard .ps{font:800 11px var(--fb);letter-spacing:.06em;color:#9be9cf;white-space:nowrap}
.perkcard.on{border-color:#61f5c4;box-shadow:0 0 18px rgba(97,245,196,.28)}
.perkcard.on .ps{color:#0c2a24;background:#61f5c4;padding:4px 8px;border-radius:999px}
.perkcard:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* Google Play edition */
html.play #perkCard,html.play #walletBtn{display:none!important}
html.play:not(.gpbill) #tShop{display:none!important}
.seekmark{width:30px;height:30px;border-radius:9px;flex:none;background:conic-gradient(from 210deg,#61f5c4,#1fb5a0,#12584f,#61f5c4);position:relative;box-shadow:0 0 12px rgba(97,245,196,.45)}
.seekmark::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2.5px solid #071a17}
.seekhd{display:flex;gap:12px;align-items:center}
.seekhd .seekmark{width:42px;height:42px;border-radius:12px}
.seekhd .seekmark::after{inset:11px}
.perks{list-style:none;margin:0;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);display:grid;gap:10px}
.perks li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.4}
.perks .pk{width:20px;height:20px;color:rgba(255,255,255,.3)}
.perks.on .pk{color:#61f5c4}
.sbadge{font:800 9.5px var(--fb);font-style:normal;letter-spacing:.08em;color:#0c2a24;background:#61f5c4;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:1px}
.paints{grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
</style>

/* traffic */
function laneBlocked(lane, s, gap){ for (const c of cars) if (c.lane === lane && Math.abs(c.s - s) < gap) return true; return false; }
let lastFree = [];
function addCar(lane, s){
  if (laneBlocked(lane, s, 22)) return false;
  const rt = RT(), type = lane === 3 && rt < .3 ? 'van' : rt < .45 ? 'sedan' : rt < .8 ? 'hatch' : lane > 1 ? 'van' : 'sedan';
  const hex = TRAFFIC_COLS[(RT() * TRAFFIC_COLS.length) | 0];
  cars.push({ lane, d: LANES[lane], s, v: LANE_V[lane], type, len: CAR_GEO[type].userData.len, w: CAR_GEO[type].userData.w, mesh: getCarMesh(type, hex) });
  return true;
}
function manageTraffic(dt){
  for (const c of cars) c.s += c.v * dt;
  for (let i = cars.length - 1; i >= 0; i--) if (cars[i].s < sP - 30) { cars[i].mesh.visible = false; cars.splice(i, 1); }
  const lvl = mode === 'track' ? 1 : Math.min(8, cps), farS = Math.min(sP + 950, finishS + 150);
  if (spawnS < sP + 260) spawnS = sP + 260;
  // Traffic comes in rows. A row is one car, sometimes two, never three: with four lanes there are always two free lanes.
  // Rows are at least 70 m apart, and after a two-car row the next two-car row keeps a free lane next to one of
  // the last free lanes, so you never need to cross two lanes in a hurry.
  while (spawnS < farS) {
    // keep the new row clear of rows spawned earlier (they have moved on since, so check where they are now)
    let near = null; for (const c of cars) if (Math.abs(c.s - spawnS) < 66 && (!near || c.s > near.s)) near = c;
    if (near) { spawnS = near.s + 70; continue; }
    const dbl = RT() < .05 + lvl * .02;
    if (dbl) {
      let pair = null;
      for (let k = 0; k < 8 && !pair; k++) {
        const a = (RT() * 4) | 0, b = (a + 1 + ((RT() * 3) | 0)) % 4, free = [0, 1, 2, 3].filter(L => L !== a && L !== b);
        if (!lastFree.length || free.some(f => lastFree.some(g => Math.abs(f - g) <= 1))) pair = [a, b, free];
      }
      if (pair) { addCar(pair[0], spawnS); addCar(pair[1], spawnS + (RT() - .5) * 4); lastFree = pair[2]; }
      else { addCar((RT() * 4) | 0, spawnS); lastFree = []; }
    } else { addCar((RT() * 4) | 0, spawnS); lastFree = []; }
    spawnS += Math.max(70, 90 + RT() * 60 - lvl * 3);
  }
}

// Menu: pad and arpeggio only, quieter. Race: full band. Off with the Music switch, or with Sound off.

  { bpm: 100, root: 40, chords: [[0, 'm'], [-2, 'M'], [-4, 'M'], [-2, 'M']] },   // Halving Canyon: E minor, slower and wider
  { bpm: 118, root: 38, chords: [[0, 'm'], [-4, 'M'], [-7, 'M'], [-5, 'm']] },   // Bear Market: D minor, darker and faster
  { bpm: 138, root: 40, rock: true, prog: [0, -4, 3, -2],                          // Liquidation Chase: rock in E minor (E C G D)
    // lead guitar melody, 4 bars: [16th step, midi note, length in 16ths]
    lead: [[[0, 76, 6], [6, 74, 2], [8, 71, 4], [12, 69, 4]],

const chordNotes = (root, q) => [root, root + (q === 'm' ? 3 : 4), root + 7];

  o.type = type; o.frequency.setValueAtTime(f, t);

// one distorted guitar chord: two slightly detuned saws per note into the amp

}
// lead guitar: one note with a slide into pitch and a little vibrato, through the same amp
function mLead(t, n, dur){
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), fl = AC.createBiquadFilter(), lfo = AC.createOscillator(), lg = AC.createGain();

// Liquidation Chase plays a recorded track ("Cold Nights" by nest-beatzofficial, Pixabay Content License), looped.
// It loads the first time a chase starts; until then the built-in rock plays.
const CHASE_TRACK = './music/chase.mp3';
function loadChaseTrack(){

  fetch(CHASE_TRACK).then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status)).then(b => AC.decodeAudioData(b)).then(buf => { MUS.chaseBuf = buf; })
    .catch(() => { MUS.chaseLoad = false; });
}

    src.buffer = MUS.chaseBuf; src.loop = true;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.62, t + .8);

}
function musicTick(){
  if (!AC || !MUS.bus) return;

  const racing = state === 'race' || state === 'count' || state === 'ending', on = musicOn && !muted && !document.hidden && state !== 'paused';

/* ================= tilt steering (device motion) ================= */
// Gravity along the screen's left-right axis gives the tilt angle, whatever way the phone is held.
// The angle at the start of each race is taken as straight ahead. 2.5° dead zone, full lock at 20°.
let tiltMode = store.get('bullrun_steer') === 'tilt';
const TILT = { ok: false, seen: false, raw: 0, zero: 0, zeroN: 0, zeroSum: 0, val: 0, listening: false, last: 0 };

// Seeker Genesis Token check, ported from @solana-mobile/skr-genesis-token (Apache-2.0) without dependencies.
// An SGT is a Token-2022 mint whose TokenGroupMember extension points at the SGT group and whose MetadataPointer points at the same address.
const SGT_GROUP = 'GT22s89nU4iWFkNXj1Bw6uYhJJWDRPpShHt4Bk8f99Te', TOKEN_2022 = 'TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb';

async function sgtMints(rpcUrl, owner, timeoutMs){
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, to = ctl && setTimeout(() => ctl.abort(), timeoutMs || 8000);
  const call = (method, params) => fetch(rpcUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }), signal: ctl && ctl.signal })
    .then(r => r.json()).then(j => { if (j.error) throw new Error(j.error.message || 'rpc error'); return j.result; });
  try {
    const ta = await call('getTokenAccountsByOwner', [owner, { programId: TOKEN_2022 }, { encoding: 'jsonParsed', commitment: 'confirmed' }]);
    const mints = [...new Set((ta.value || []).filter(a => a.account.data.parsed.info.tokenAmount.amount !== '0').map(a => a.account.data.parsed.info.mint))];
    const out = [];

}

const uerr = m => Object.assign(new Error(m), { user: true });

    if (r.b.seeker && !WAL.seeker) { WAL.seeker = true; WAL.seekerChecked = true; saveW(); renderPerkCard(); }
    // send this phone's existing bests once
    if (best > 0) lbQueue.push(['endless', Math.round(best * 1000)]);

const saveSH = () => store.set('bullrun_shop', JSON.stringify(SH));
const usdTxt = n => '$' + n.toFixed(2);
let prices = null, pricesT = 0, shopBusy = false, payLib = null;
async function getPrices(){
  if (prices && Date.now() - pricesT < 60e3) return prices;
  try { const r = await fetch(SHOP.priceApi + [SHOP.mints.SOL, SHOP.mints.SKR].join(',')), j = await r.json();
    const pf = k => { const x = j[SHOP.mints[k]] || (j.data && j.data[SHOP.mints[k]]); return x ? +(x.usdPrice || x.price) : null; };
    prices = { SOL: pf('SOL'), SKR: pf('SKR'), USDC: 1 }; pricesT = Date.now(); } catch (e) { prices = { SOL: null, SKR: null, USDC: 1 }; }
  return prices;
}
function quote(id, sym){ const pr = prices && prices[sym]; if (!pr) return null; const u = PRODUCTS[id].usd * (sym === 'SKR' ? 1 - SHOP.skrDiscount : 1), dp = sym === 'SOL' ? 5 : 2; return { sym, amount: Math.ceil(u / pr * 10 ** dp) / 10 ** dp, usd: u }; }
function loadPay(){
  if (payLib) return Promise.resolve(payLib);
  return new Promise((res, rej) => { if (window.SVPay) { payLib = SVPay.make(WCFG.rpc); return res(payLib); }
    const sc = document.createElement('script'); sc.src = 'pay.bundle.js'; sc.onload = () => { payLib = SVPay.make(WCFG.rpc); res(payLib); }; sc.onerror = () => rej(new Error('pay module')); document.head.appendChild(sc); });
}

async function payNow(id, name, q){
  const L = T[lang]; shopBusy = true;
  dlg('<h2>' + name + '</h2><div class="sspin"></div><p id="shStep" role="status">' + L.checkingBal + '</p>');
  const step = x => { const e = $('shStep'); if (e) e.textContent = x; };
  const fail = msg => { shopBusy = false; dlg('<h2>' + name + '</h2><p class="serr">' + msg + '</p><div class="wbtns"><button class="btn2" type="button" id="shAgain">' + L.tryAgain + '</button><button class="btn2" type="button" id="shX">' + L.close + '</button></div>');
    $('shAgain').onclick = () => checkout(id); $('shX').onclick = closeDlg; };
  try {
    await waitWallet(); const P = await loadPay();
    const bal = await P.balance(WAL.addr, q.sym);
    if (bal < q.amount + (q.sym === 'SOL' ? 0.0002 : 0)) return fail(L.noFunds(q.sym, +bal.toFixed(4)));
    if (q.sym !== 'SOL' && await P.balance(WAL.addr, 'SOL') < 0.0001) return fail(L.needSol);
    step(L.approve); await SVWallet.ensure();
    if (SVWallet.address && SVWallet.address !== WAL.addr) return fail(L.otherWallet);
    const { bytes } = await P.build({ payer: WAL.addr, treasury: SHOP.treasury, sym: q.sym, amount: q.amount, memo: SHOP.prefix + id });
    let sig;
    try { const r = await SVWallet.signAndSend(bytes); sig = r.signature ? P.bs58.encode(r.signature) : await P.send(r.signed); } catch (e) { console.warn(e); return fail(L.cancelled); }
    step(L.confirming);
    let confirmed = false; try { confirmed = await P.confirm(sig); } catch (e) { return fail(L.txFailed); }
    shopBusy = false;
    SH.own[id] = { sig, sym: q.sym, amount: q.amount, t: Date.now(), pending: !confirmed }; saveSH();
    dlg('<h2>' + L.thanks + '</h2><p>' + L.garageThanks + (confirmed ? '' : ' ' + L.pendingNote) + '</p>' +
      '<div class="ssum"><span>' + L.paid + '</span><b>' + q.amount + ' ' + q.sym + '</b><span>' + L.receipt + '</span><b><a href="https://solscan.io/tx/' + sig + '" target="_blank" rel="noopener">' + shortAddr(sig) + '</a></b></div>' +
      '<button class="go" type="button" id="shX">' + L.done + '</button>');
    $('shX').onclick = closeDlg; if (state === 'garage') renderGarage();
  } catch (e) { console.warn(e); fail(L.genericErr); } finally { shopBusy = false; }
}
async function restore(){
  if (!needWallet()) return;
  const L = T[lang];
  dlg('<h2>' + L.restore + '</h2><div class="sspin"></div><p>' + L.readingHistory + '</p>');
  try {
    const P = await loadPay(); await getPrices();
    const pays = await P.payments(WAL.addr, SHOP.treasury, SHOP.prefix);
    let found = 0;
    for (const x of pays) {
      const id = x.memo.slice(SHOP.prefix.length), prod = PRODUCTS[id]; if (!prod || !prod.restorable) continue;
      const worth = x.sym === 'USDC' ? x.amount : (prices[x.sym] ? x.amount * prices[x.sym] : null), floor = x.sym === 'USDC' ? prod.usd * .95 * (1 - SHOP.skrDiscount) : prod.usd * .4 * (1 - SHOP.skrDiscount);
      if (worth != null && worth < floor) continue;
      if (!SH.own[id]) { SH.own[id] = { sig: x.sig, sym: x.sym, amount: x.amount, t: (x.time || 0) * 1000, restored: true }; found++; }
    }
    saveSH();
    dlg('<h2>' + L.restore + '</h2><p>' + (found ? L.restored(found) : SH.own.garage ? L.allRestored : L.noneFound) + '</p><button class="btn2" type="button" id="shX">' + L.back + '</button>');
  } catch (e) { console.warn(e); dlg('<h2>' + L.restore + '</h2><p class="serr">' + L.historyErr + '</p><button class="btn2" type="button" id="shX">' + L.back + '</button>'); }
  $('shX').onclick = openShop; if (state === 'garage') renderGarage();
}

/* ---------- Google Play Billing (Play edition only, inside the Play Store app) ----------
   Digital Goods API + Payment Request. pay.stratoshivibes.com checks each purchase with Google and acknowledges it. */
const GP_SKU = { garage: 'garage_pass' };
const GP_API = store.get('bullrun_gp_api') || 'https://pay.stratoshivibes.com';
let gp = null, gpItems = {}, gpStatus = 'not started';
SH.gpTok = SH.gpTok || {};
const gpPrice = id => { const d = gpItems[GP_SKU[id]]; if (!d) return '';
  try { return new Intl.NumberFormat(lang === 'el' ? 'el-GR' : navigator.language || 'en', { style: 'currency', currency: d.price.currency }).format(+d.price.value); }
  catch (e) { return d.price.value + ' ' + d.price.currency; } };
async function gpVerify(sku, token){        // true = valid, false = Google says invalid, null = could not check now
  try { const r = await fetch(GP_API + '/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sku, token }) });
    if (r.status >= 500) return null; const j = await r.json(); return j.ok === true ? true : j.ok === false ? false : null; }
  catch (e) { console.warn(e); return null; }
}
function gpGrant(token){
  if (SH.gpTok[token]) return false;
  SH.gpTok[token] = 'granted'; if (!SH.own.garage) SH.own.garage = { play: true, t: Date.now() }; saveSH();
  if (state === 'garage') renderGarage();
  return true;
}
async function gpAck(token){ if (SH.gpTok[token] === 'acked') return; if (await gpVerify(GP_SKU.garage, token) === true) { SH.gpTok[token] = 'acked'; saveSH(); } }
async function gpSync(){                     // restores the Garage and acknowledges any purchase that was not confirmed yet
  if (!gp) return 0; let added = 0;
  try { for (const p of await gp.listPurchases()) { if (p.itemId !== GP_SKU.garage) continue; if (gpGrant(p.purchaseToken)) added++; await gpAck(p.purchaseToken); } }
  catch (e) { console.warn(e); }
  return added;
}
async function gpInit(){
  if (!PLAY) return;
  if (!('getDigitalGoodsService' in window)) { gpStatus = 'no Digital Goods API'; return; }
  try { gp = await window.getDigitalGoodsService('https://play.google.com/billing'); } catch (e) { gp = null; gpStatus = 'service error: ' + (e && e.message); return; }
  if (!gp) { gpStatus = 'service unavailable'; return; }
  try { (await gp.getDetails(Object.values(GP_SKU))).forEach(d => { gpItems[d.itemId] = d; }); } catch (e) { gpStatus = 'details error: ' + (e && e.message); }
  if (!Object.keys(gpItems).length) { gp = null; if (gpStatus === 'not started') gpStatus = 'no products returned'; return; }
  gpStatus = 'ok'; document.documentElement.classList.add('gpbill');
  gpSync();
}
function gpOpenShop(){
  const L = T[lang];
  if (!gp) { toast(L.gpUnavail, 'Google Play: ' + gpStatus); return; }
  const own = !!SH.own.garage;
  dlg('<h2>' + L.shop + '</h2><p>' + L.gpIntro + '</p>' +
    '<div class="sitem">' + swatches(['chrome', 'gold', 'candy', 'neon']) + '<div><b>' + L.garageName + '</b><div class="ds">' + L.garageDesc + '</div><div class="rw"><span class="pr">' + gpPrice('garage') + '</span>' +
      (own ? '<span class="own">✓ ' + L.owned + '</span>' : '<button class="sbuy" type="button" data-buy>' + L.buy + '</button>') + '</div></div></div>' +
    '<p class="fine">' + L.gpNote + '</p>' +
    '<div class="wbtns"><button class="btn2" type="button" data-restore>' + L.restore + '</button><button class="btn2" type="button" data-x>' + L.close + '</button></div>');
  D().dataset.k = 'shop';
  D().querySelector('[data-x]').onclick = closeDlg;
  D().querySelector('[data-restore]').onclick = async () => {
    dlg('<h2>' + L.restore + '</h2><div class="sspin"></div>');
    const n = await gpSync();
    dlg('<h2>' + L.restore + '</h2><p>' + (n ? L.restored(n) : SH.own.garage ? L.allRestored : L.gpRestored) + '</p><button class="btn2" type="button" id="shX">' + L.back + '</button>');
    $('shX').onclick = gpOpenShop;
  };
  const b = D().querySelector('[data-buy]'); if (b) b.onclick = gpBuy;
}
async function gpBuy(){
  const L = T[lang], name = L.garageName;
  const fail = msg => { shopBusy = false; dlg('<h2>' + name + '</h2><p class="serr">' + msg + '</p><button class="btn2" type="button" id="shX">' + L.close + '</button>'); $('shX').onclick = gpOpenShop; };
  if (!gp) return fail(L.gpUnavail);
  shopBusy = true;
  dlg('<h2>' + name + '</h2><div class="sspin" role="status"></div><p id="shStep">' + L.gpOpening + '</p>');
  let resp;
  try {
    const req = new PaymentRequest([{ supportedMethods: 'https://play.google.com/billing', data: { sku: GP_SKU.garage } }], { total: { label: 'Total', amount: { currency: 'EUR', value: '0' } } });
    resp = await req.show();
  } catch (e) { console.warn(e); return fail(e && e.name === 'AbortError' ? L.gpCancelled : L.gpUnavail); }
  const token = resp.details && resp.details.purchaseToken;
  if (!token) { try { await resp.complete('fail'); } catch (e) {} return fail(L.gpUnavail); }
  const st = $('shStep'); if (st) st.textContent = L.gpChecking;
  const ok = await gpVerify(GP_SKU.garage, token);
  if (ok === false) { try { await resp.complete('fail'); } catch (e) {} return fail(L.gpInvalid); }
  gpGrant(token); if (ok === true) { SH.gpTok[token] = 'acked'; saveSH(); }
  try { await resp.complete('success'); } catch (e) {}
  shopBusy = false;
  dlg('<h2>' + L.thanks + '</h2><p>' + L.garageThanks + '</p><button class="go" type="button" id="shX">' + L.done + '</button>');
  $('shX').onclick = closeDlg; if (state === 'garage') renderGarage();
}
gpInit();

/* adaptive quality: drop bloom, then resolution, then shadows if the phone struggles */
const perf = { t: 0, n: 0, reset(){ this.t = 0; this.n = 0; } };
function perfCheck(dt){
  if (state !== 'race') return;
  perf.t += dt; perf.n++;
  if (perf.t > 3) {
    const avg = perf.t / perf.n; perf.reset();
    if (avg > 1 / 45) {
      if (useBloom) useBloom = false;
      else if (quality === 2) { quality = 1; resize(); }
      else if (renderer.shadowMap.enabled) { renderer.shadowMap.enabled = false; player.castShadow = false; }
    }
  }
}

window.__bullrun = { get mus(){ return { step: MUS.step, song: MUS.song, level: MUS.level, ctx: AC && AC.state, track: !!MUS.chaseSrc, buf: !!MUS.chaseBuf }; }, get info(){ return renderer.info.render.calls + ' calls ' + renderer.info.render.triangles + ' tris'; }, get state(){ return state; }, get raceT(){ return raceT; }, get result(){ return result; },
  get cars(){ return cars.map(c => ({ s: c.s, lane: c.lane })); }, get fly(){ return { charges: flyCharges, t: flyT, h: flyH, kmh: Math.round(v * 3.6) }; }, get chase(){ return { n: chasers.length, coll: collateral, knocks, escapes, list: chasers.map(c => ({ gap: +(sP - c.s).toFixed(1), lane: c.lane, phase: c.phase })) }; }, get hits(){ return hitsN; }, setPar(a){ TRACKS.forEach((t, i) => { if (a[i] != null) t.par = a[i]; }); }, get d(){ return d; }, get steerV(){ return steer; }, get tilt(){ return TILT; }, jump(x){ sP = x; }, start: startRace, garage: openGarage, go, set bot(x){ bot = x; }, set autoGas(x){ autoGas = x; }, setPar(arr){ arr.forEach((p, i) => TRACKS[i].par = p); },
  sim(sec){ for (let i = 0; i < sec * 60; i++) { if (state !== 'paused' && state !== 'over') update(1 / 60); } },
  simUntilOver(maxSec){ let i = 0; while (state !== 'over' && i < maxSec * 60) { update(1 / 60); if (state === 'ending') { endT = 0; update(1 / 60); } i++; } return result; },
  gcam(x){ GCAM = x; }, paint(id){ showPaint(id); }, cam(b, h, la, ly){ CAMP = [b, h, la, ly]; }, camL(b, h, la, ly){ CAMP_L = [b, h, la, ly]; } };
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (state !== 'paused' && state !== 'over') update(dt);
  render(dt); hud(); perfCheck(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Anonymous play counter (StratoshiVibes). Sends: the game, what is on screen (menu or a game mode), seconds played,
// a random device number made on this device, and whether it runs in the app or a browser.
// No cookies, no wallet address, no names, no IP stored. Counts only while the page is visible.
(function(){
  if (window.SVStats || navigator.webdriver) return;
  const EP = 'https://lb.stratoshivibes.com/ping';
  const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
  let dev = ls.get('sv_dev');
  if (!dev || !/^[a-z0-9]{12,32}$/.test(dev)) { const b = new Uint8Array(10); crypto.getRandomValues(b); dev = [...b].map(x => x.toString(36).padStart(2, '0')).join('').slice(0, 16); ls.set('sv_dev', dev); }
  let src = null; try { src = sessionStorage.getItem('sv_src'); } catch(e){}
  if (!src) {
    const ua = navigator.userAgent || '';
    const app = /^android-app:/.test(document.referrer || '') || /; wv\)/.test(ua) || matchMedia('(display-mode: standalone)').matches;
    src = (app ? 'app' : /Android/.test(ua) ? 'android' : /iPhone|iPad/.test(ua) ? 'ios' : 'desktop') + (/seeker/i.test(ua) ? '-seeker' : '');
    try { sessionStorage.setItem('sv_src', src); } catch(e){}
  }
  let game = null, getMode = () => 'menu';
  const acc = {};               // mode -> seconds not yet sent
  let lastSend = Date.now();
  function send(){
    lastSend = Date.now();
    const modes = Object.keys(acc).filter(m => acc[m] > 0);
    if (!game || !modes.length) return;
    const body = JSON.stringify({ g: game, d: dev, p: src, t: modes.map(m => [m, Math.min(120, acc[m])]) });
    for (const m of modes) delete acc[m];
    try { if (navigator.sendBeacon && navigator.sendBeacon(EP, body)) return; } catch(e){}
    try { fetch(EP, { method: 'POST', body, keepalive: true, mode: 'no-cors' }); } catch(e){}
  }
  setInterval(() => {
    if (!game || document.visibilityState !== 'visible') return;
    let m = 'menu'; try { m = String(getMode() || 'menu').toLowerCase().replace(/[^a-z0-9:_-]/g, '').slice(0, 24) || 'menu'; } catch(e){}
    acc[m] = (acc[m] || 0) + 1;
    if (Date.now() - lastSend >= 60000) send();
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') send(); });
  addEventListener('pagehide', send);
  window.SVStats = { start(g, fn){ game = g; if (fn) getMode = fn; } };
})();
if (window.SVStats) SVStats.start('bullrun', () => {
  if (state === 'garage') return 'garage';
  if (state === 'race' || state === 'count' || state === 'ending') return isDaily() ? 'daily' : mode === 'endless' ? 'endless' : mode === 'chase' ? 'chase' : 'track';
  return 'menu';
});

// Rating request (StratoshiVibes). Shown once, only inside the dApp Store app, after enough real play,
// and only while the player is on a menu (never in the middle of a game). "Not now" closes it for good.
window.SVRate = function (o) {
  const IN_APP = /; wv\)/.test(navigator.userAgent) || /^android-app:/.test(document.referrer || '');
  const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
  if (!IN_APP || ls.get('sv_rate')) return;
  let played = +(ls.get('sv_rate_play') || 0), shown = false;
  const T = {
    el: { h: 'Σου αρέσει το ' + o.name + ';', p: 'Μια σύντομη αξιολόγηση στο dApp Store βοηθάει πολύ έναν μικρό δημιουργό. Γράψε ειλικρινά τη γνώμη σου, θετική ή αρνητική: μου λέει τι να βελτιώσω.', go: 'Αξιολόγησε στο dApp Store', no: 'Όχι τώρα' },
    en: { h: 'Enjoying ' + o.name + '?', p: 'A quick rating on the dApp Store helps a small creator a lot. Please be honest, good or bad: it tells me what to improve.', go: 'Rate on the dApp Store', no: 'Not now' }
  };
  function show() {
    shown = true; ls.set('sv_rate', 'asked');
    const t = T[o.lang() === 'el' ? 'el' : 'en'];
    const w = document.createElement('div');
    w.setAttribute('translate', 'no'); w.className = 'notranslate';
    w.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:20px;background:rgba(4,6,20,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)';
    const F = 'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:normal;text-transform:none;text-align:center;';
    w.innerHTML = '<div role="dialog" aria-modal="true" style="all:initial;display:block;' + F + 'max-width:340px;width:100%;box-sizing:border-box;padding:24px 20px 18px;border-radius:20px;background:linear-gradient(160deg,#141a3f,#0b0f26);border:1px solid rgba(155,107,255,.55);box-shadow:0 0 40px rgba(155,107,255,.35);color:#eef0ff;font-size:15px;line-height:1.45">' +
      '<span style="all:initial;display:block;' + F + 'font-size:24px;line-height:1;margin-bottom:10px;color:#f6c744;letter-spacing:4px">★★★★★</span>' +
      '<h2 style="all:initial;display:block;' + F + 'margin:0 0 10px;font-size:21px;font-weight:800;line-height:1.25;color:#fff"></h2>' +
      '<p style="all:initial;display:block;' + F + 'margin:0 0 18px;font-size:15px;line-height:1.45;color:#b9bedf"></p>' +
      '<a style="all:initial;display:block;' + F + 'cursor:pointer;padding:13px 16px;border-radius:14px;background:linear-gradient(90deg,#22e4ff,#9b6bff,#ff4fd8);color:#0a0d22;font-size:16px;font-weight:800"></a>' +
      '<button type="button" style="all:initial;display:block;box-sizing:border-box;' + F + 'cursor:pointer;margin-top:10px;width:100%;padding:12px;border-radius:14px;border:1px solid rgba(34,228,255,.4);color:#cfe9ff;font-size:15px;font-weight:600"></button></div>';
    w.querySelector('h2').textContent = t.h; w.querySelector('p').textContent = t.p;
    const a = w.querySelector('a'); a.textContent = t.go; a.href = 'solanadappstore://details?id=' + o.pkg;
    const b = w.querySelector('button'); b.textContent = t.no;
    a.addEventListener('click', () => { ls.set('sv_rate', 'opened'); setTimeout(() => w.remove(), 400); });
    b.addEventListener('click', () => w.remove());
    document.body.appendChild(w);
  }
  setInterval(() => {
    if (shown || document.visibilityState !== 'visible') return;
    let m = 'menu'; try { m = o.mode(); } catch(e){}
    if (m === 'play') { played++; if (played % 5 === 0) ls.set('sv_rate_play', String(played)); }
    else if (m === 'menu' && played >= o.after) { ls.set('sv_rate_play', String(played)); setTimeout(show, 600); shown = true; }
  }, 1000);
};
SVRate({ name: 'Bull Run', pkg: 'com.stratoshivibes.bullrun', after: 480, lang: () => lang,
  mode: () => (state === 'race' || state === 'count' || state === 'ending') ? 'play' : (state === 'menu' && screen === 'home') ? 'menu' : 'other' });
