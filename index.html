<style>
/* Layout: full-screen portrait racer. Canvas world underneath; glass HUD on top, thumb pads at the bottom corners. One committed dusk-arcade look (dark only). */
:root{
  --bg:#0b0820;
  --ink:#fbf8ff;
  --dim:#c3bce6;
  --mute:#8f88bb;
  --glass:rgba(14,10,38,.5);
  --glass-on:rgba(255,255,255,.2);
  --line:rgba(255,255,255,.22);
  --sol-a:#a35cff;
  --sol-b:#14f0a0;
  --hot:#ff3a5c;
  --cyan:#3fe6ff;
  --gold:#ffc24a;
  --fd:"Saira","Arial Narrow",Arial,sans-serif;
  --fb:"Commissioner",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 var(--fb);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
button{font:inherit;color:inherit}
.num{font-family:var(--fd);font-style:italic;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lab{font:800 10px/1 var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:2;pointer-events:none;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;text-shadow:0 2px 12px rgba(10,6,30,.6)}
.hud .col{display:flex;flex-direction:column;gap:5px;min-width:0}
.hud .r{align-items:flex-end;text-align:right}
.hud .big{font-size:28px;line-height:.95;white-space:nowrap}
.hud .big small{font:800 12px var(--fb);font-style:normal;color:var(--dim);margin-left:3px;letter-spacing:.06em}
.tok{display:flex;align-items:center;gap:6px;font-size:20px}
.tok svg{width:20px;height:20px;flex:none;filter:drop-shadow(0 0 6px rgba(163,92,255,.7))}
.time{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.time .num{font-size:52px;line-height:.9;text-shadow:0 0 22px rgba(255,90,140,.55),0 2px 12px rgba(10,6,30,.6)}
.time.low .num{color:#ff5a6e;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.spdbar{width:96px;height:8px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
.spdbar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--cyan),#fff 70%,var(--hot))}
.pausebtn{position:fixed;z-index:4;left:max(16px, env(safe-area-inset-left, 0px));top:calc(env(safe-area-inset-top, 0px) + 92px);
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pausebtn svg{width:16px;height:16px;fill:var(--ink)}

/* messages */
.flash{position:fixed;left:50%;top:27%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;text-align:center;opacity:0;white-space:nowrap}
.flash b{display:block;font:italic 900 34px/1 var(--fd);letter-spacing:.01em;color:#fff;text-shadow:0 0 18px rgba(63,230,255,.8),0 3px 14px rgba(10,6,30,.6)}
.flash small{display:block;margin-top:6px;font:800 14px var(--fb);letter-spacing:.08em;color:var(--sol-b);text-shadow:0 2px 10px rgba(10,6,30,.7)}
.flash.warm b{text-shadow:0 0 18px rgba(255,90,140,.9),0 3px 14px rgba(10,6,30,.6)}
.flash.show{animation:fl 1.7s ease-out both}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.85)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}78%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-75%)}}
.count{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;font:italic 900 110px/1 var(--fd);color:#fff;text-shadow:0 0 30px rgba(255,79,216,.8),0 6px 20px rgba(10,6,30,.5)}
.count.pop{animation:pop .9s ease-out both}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}

/* touch pads */
.pad{position:fixed;left:0;right:0;bottom:0;z-index:3;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px))}
.pad>*{pointer-events:auto}
.steer{display:flex;width:min(46vw,200px);height:88px;border-radius:24px;background:var(--glass);border:1px solid var(--line);overflow:hidden;touch-action:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.steer span{flex:1;display:grid;place-items:center;transition:background .08s}
.steer span+span{border-left:1px solid var(--line)}
.steer span.on{background:var(--glass-on)}
.steer svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rcol{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.pedals{display:flex;gap:10px;align-items:flex-end}
.ped{width:64px;height:88px;border-radius:18px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .08s,transform .08s}
.ped.gas{height:104px}
.ped svg{width:26px;height:34px}
.ped small{font:800 10px var(--fb);letter-spacing:.14em;color:var(--dim)}
.ped.on{background:var(--glass-on);transform:scale(.96)}
.ped.gas.on{box-shadow:0 0 0 2px var(--sol-b) inset}
.ped.brake.on{box-shadow:0 0 0 2px var(--hot) inset}
.nitro{width:138px;height:44px;border-radius:14px;border:1px solid rgba(63,230,255,.5);background:rgba(10,30,60,.55);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:none;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nitro b{font:italic 900 16px var(--fd);letter-spacing:.06em;color:#fff}
.nitro .pips{display:flex;gap:4px}
.nitro .pips u{width:9px;height:16px;border-radius:2px;background:rgba(255,255,255,.18);transform:skewX(-14deg)}
.nitro .pips u.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.nitro.ready{box-shadow:0 0 16px rgba(63,230,255,.45)}
.nitro.active{background:rgba(63,230,255,.35)}
.nitro:disabled{opacity:.55}

/* menus */
.menu{position:fixed;inset:0;z-index:5;overflow-y:auto;display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(180deg,rgba(11,8,32,.25) 0%,rgba(11,8,32,.72) 45%,rgba(11,8,32,.92) 100%)}
.card{width:min(100%, 380px);display:flex;flex-direction:column;gap:14px}
.eyebrow{font:800 11px var(--fb);letter-spacing:.34em;color:var(--cyan)}
.title{margin:0;font:italic 900 clamp(64px, 22vw, 92px)/.82 var(--fd);letter-spacing:-.02em;text-wrap:balance;
  background:linear-gradient(180deg,#fff 0%,#ffe2a0 38%,#ff8a52 62%,#ff3a8a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,80,140,.45))}
.tag{margin:0;color:var(--dim);font-size:15px;line-height:1.45;text-wrap:pretty}
.rules{list-style:none;margin:0;padding:12px 14px;display:grid;gap:9px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.4;color:var(--ink)}
.rules svg{width:22px;height:22px;margin-top:-1px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;font:700 13px var(--fb);color:var(--dim);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#150d34}
.go{border:0;border-radius:16px;padding:16px 20px;cursor:pointer;font:italic 900 22px var(--fd);letter-spacing:.04em;color:#140b2c;
  background:linear-gradient(90deg,#ffd27a,#ff8a52 45%,#ff3a8a);box-shadow:0 6px 26px rgba(255,90,120,.45)}
.go.alt{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1px solid var(--line);font-size:17px}
.go:focus-visible,.seg button:focus-visible,.pausebtn:focus-visible,.nitro:focus-visible{outline:2px solid #fff;outline-offset:3px}
.meta{margin:0;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.proto{margin:0;font-size:12px;color:var(--mute)}
.res{font:italic 900 64px/.9 var(--fd);font-variant-numeric:tabular-nums}
.res small{font:800 18px var(--fb);font-style:normal;color:var(--dim);margin-left:6px}
.chip{align-self:flex-start;font:800 11px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:#120b2a;background:var(--sol-b);padding:5px 10px;border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.stats b{font:italic 900 24px/1 var(--fd);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
.ol,.or{display:flex;flex-direction:column;gap:14px;min-width:0}
.row .go{flex:1}
@media (prefers-reduced-motion: reduce){.flash.show,.count.pop,.time.low .num{animation-duration:.01s}}

/* screens */
.card.wide{width:min(100%, 640px)}
.bar{display:flex;align-items:center;gap:12px;min-height:44px}
.bar h2{margin:0;flex:1;font:italic 900 28px/1 var(--fd);letter-spacing:.01em}
.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:20px;height:20px;color:var(--ink)}
.bank{display:inline-flex;align-items:center;gap:6px;font-size:20px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07)}
.bank svg{width:18px;height:18px;color:var(--gold);fill:currentColor}
.mainbtns{display:grid;gap:10px}
.mainbtns .go{display:flex;align-items:baseline;justify-content:space-between;gap:12px;text-align:left}
.mainbtns .go small{font:800 13px var(--fb);font-style:normal;opacity:.75;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);cursor:pointer;font:700 12px var(--fb);color:var(--ink);min-width:0}
.tile svg{width:24px;height:24px;color:var(--ink)}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(10,8,30,.4);cursor:pointer;font:700 13px var(--fb);color:var(--ink)}
.wbtn svg{width:16px;height:16px;flex:none}
.wbtn small{color:var(--dim);font-weight:600}
.wbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--sol-b);box-shadow:0 0 8px var(--sol-b)}
.tlist{display:grid;gap:16px}
.mkt h3{margin:0 0 8px;display:flex;align-items:center;gap:8px;font:800 11px var(--fb);letter-spacing:.2em;color:var(--dim)}
.mkt h3 i{width:10px;height:10px;border-radius:3px;display:block}
.trow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trk{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);cursor:pointer;text-align:left;min-width:0;color:var(--ink)}
.trk b{font:italic 900 15px/1.1 var(--fd);letter-spacing:.01em;text-wrap:balance;hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.trk .n{font:italic 900 12px var(--fd);color:var(--dim)}
.trk .sm{font:600 11.5px var(--fb);color:var(--dim);font-variant-numeric:tabular-nums}
.trk .st{display:flex;gap:2px}
.trk .st svg{width:15px;height:15px;fill:rgba(255,255,255,.18)}
.trk .st svg.on{fill:var(--gold);filter:drop-shadow(0 0 4px rgba(255,194,74,.6))}
.trk:disabled{cursor:default;opacity:.5}
.trk .lk{position:absolute;top:10px;right:10px;width:16px;height:16px;color:var(--dim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  padding:0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px))}
.sheetcard{width:min(100%, 520px);display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:24px;background:rgba(12,9,34,.82);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.gname{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.gname b{font:italic 900 22px var(--fd)}
.gname span{font:600 12.5px var(--fb);color:var(--dim)}
.paints{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.sw{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;border:2px solid transparent;cursor:pointer;padding:0;overflow:hidden;box-shadow:inset 0 -10px 18px rgba(0,0,0,.28)}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),inset 0 -10px 18px rgba(0,0,0,.28)}
.sw .lk{position:absolute;inset:auto 4px 4px auto;width:15px;height:15px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.sw .eq{position:absolute;inset:4px auto auto 4px;width:9px;height:9px;border-radius:50%;background:var(--sol-b);box-shadow:0 0 6px var(--sol-b)}
.go:disabled{opacity:.55;cursor:default}
.dlg{z-index:7;background:rgba(6,4,20,.72)}
.dlg .card{background:rgba(16,12,42,.96);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:18px;max-height:calc(100% - 20px);overflow-y:auto}
.dlg h2{margin:0;font:italic 900 26px/1.05 var(--fd)}
.dlg p{margin:0;color:var(--dim);line-height:1.5;font-size:14px}
.dlg p b{color:var(--ink)}
.fine{font-size:12px!important;color:var(--mute)!important}
.serr{color:#ff8fa0!important}
.btn2{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;cursor:pointer;font:700 14px var(--fb);color:var(--ink)}
.wbtns{display:flex;flex-wrap:wrap;gap:8px}
.wbtns>*{flex:1 1 auto}
.wlist{display:grid;gap:8px}
.witem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;text-align:left;color:var(--ink);font:700 14px var(--fb)}
.witem img{width:32px;height:32px;border-radius:8px}
.witem small{display:block;font-weight:600;color:var(--dim);font-size:12px}
.waddr{font:600 12px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;padding:10px;border-radius:12px;background:rgba(255,255,255,.06)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 11px;font:700 12.5px var(--fb);color:var(--dim);cursor:pointer}
.tabs button.on{background:var(--ink);color:#150d34;border-color:var(--ink)}
.lblist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.lblist li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13.5px}
.lblist li.me{background:rgba(20,240,160,.16)}
.lblist .r{color:var(--dim);font-weight:800}
.lblist .s{font:italic 900 15px var(--fd)}
.sitem{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.06)}
.sitem .ic{display:flex;gap:3px;align-items:center}
.sitem .ic i{width:16px;height:30px;border-radius:5px;display:block}

  player.position.y += Math.sin(tNow * 23) * .006 * sp + (Math.abs(d) > CURB + .2 && v > 5 ? (Math.random() - .5) * .04 : 0);

function drawFx(){

    const a = clamp(p.life / p.max, 0, 1);

    else if (p.type === 'txt') { fctx.globalAlpha = a; fctx.fillStyle = '#fff'; fctx.font = 'italic 900 ' + Math.round(24 * k) + 'px ' + DF; fctx.textAlign = 'center'; fctx.textBaseline = 'middle'; fctx.fillText('+1', p.x, p.y); }
    else if (p.type === 'tok') { fctx.globalAlpha = a; fctx.fillStyle = p.col; const s = p.size; fctx.beginPath(); fctx.moveTo(p.x, p.y - s); fctx.lineTo(p.x + s, p.y); fctx.lineTo(p.x, p.y + s); fctx.lineTo(p.x - s, p.y); fctx.closePath(); fctx.fill(); }
    else { fctx.globalAlpha = a * .7; fctx.fillStyle = p.col; fctx.beginPath(); fctx.arc(p.x, p.y, p.size, 0, 7); fctx.fill(); }
  }

    for (const s of streaks) { const ca = Math.cos(s.a), sa = Math.sin(s.a); fctx.globalAlpha = inten * clamp(s.r, 0, 1) * .45; fctx.beginPath(); fctx.moveTo(vx + ca * s.r * RR, vy + sa * s.r * RR); fctx.lineTo(vx + ca * (s.r + s.l) * RR, vy + sa * (s.r + s.l) * RR); fctx.stroke(); }

}

let screen = 'home';

  $('hud').hidden = !(racing || state === 'ending');
  $('hProg').hidden = mode !== 'track';
  $('pad').hidden = !racing; $('pauseBtn').hidden = !racing; $('bG').hidden = autoGas;
  $('start').hidden = !(state === 'menu' && screen === 'home');

}
function go(scr){ screen = scr; if (scr === 'tracks') renderTracks(); if (scr === 'home') renderHome(); setUI(); }
function startRace(opt){

  if (opt.track != null) { mode = 'track'; TR = TRACKS[opt.track]; } else if (opt.endless) { mode = 'endless'; TR = null; }

  bank += tokens; saveBank();

    const idx = TRACKS.indexOf(TR), st = starTimes(TR), prev = PROG[TR.id] || { s: 0, b: null };

      stars = result.t <= st[2] ? 3 : result.t <= st[1] ? 2 : result.t <= st[0] ? 1 : 0;
      isBest = prev.b == null || result.t < prev.b;

async function getPrices(){

    const pf = k => { const x = j[SHOP.mints[k]] || (j.data && j.data[SHOP.mints[k]]); return x ? +(x.usdPrice || x.price) : null; };
    prices = { SOL: pf('SOL'), SKR: pf('SKR'), USDC: 1 }; pricesT = Date.now(); } catch (e) { prices = { SOL: null, SKR: null, USDC: 1 }; }

}
function quote(id, sym){ const pr = prices && prices[sym]; if (!pr) return null; const u = PRODUCTS[id].usd * (sym === 'SKR' ? 1 - SHOP.skrDiscount : 1), dp = sym === 'SOL' ? 5 : 2; return { sym, amount: Math.ceil(u / pr * 10 ** dp) / 10 ** dp, usd: u }; }

async function payNow(id, name, q){
  const L = T[lang]; shopBusy = true;
  dlg('<h2>' + name + '</h2><div class="sspin"></div><p id="shStep" role="status">' + L.checkingBal + '</p>');
  const step = x => { const e = $('shStep'); if (e) e.textContent = x; };
  const fail = msg => { shopBusy = false; dlg('<h2>' + name + '</h2><p class="serr">' + msg + '</p><div class="wbtns"><button class="btn2" type="button" id="shAgain">' + L.tryAgain + '</button><button class="btn2" type="button" id="shX">' + L.close + '</button></div>');
    $('shAgain').onclick = () => checkout(id); $('shX').onclick = closeDlg; };
  try {
    await waitWallet(); const P = await loadPay();
    const bal = await P.balance(WAL.addr, q.sym);
    if (bal < q.amount + (q.sym === 'SOL' ? 0.0002 : 0)) return fail(L.noFunds(q.sym, +bal.toFixed(4)));
    if (q.sym !== 'SOL' && await P.balance(WAL.addr, 'SOL') < 0.0001) return fail(L.needSol);
    step(L.approve); await SVWallet.ensure();
    if (SVWallet.address && SVWallet.address !== WAL.addr) return fail(L.otherWallet);
    const { bytes } = await P.build({ payer: WAL.addr, treasury: SHOP.treasury, sym: q.sym, amount: q.amount, memo: SHOP.prefix + id });
    let sig;
    try { const r = await SVWallet.signAndSend(bytes); sig = r.signature ? P.bs58.encode(r.signature) : await P.send(r.signed); } catch (e) { console.warn(e); return fail(L.cancelled); }
    step(L.confirming);
    let confirmed = false; try { confirmed = await P.confirm(sig); } catch (e) { return fail(L.txFailed); }
    shopBusy = false;
    SH.own[id] = { sig, sym: q.sym, amount: q.amount, t: Date.now(), pending: !confirmed }; saveSH();
    dlg('<h2>' + L.thanks + '</h2><p>' + L.garageThanks + (confirmed ? '' : ' ' + L.pendingNote) + '</p>' +
      '<div class="ssum"><span>' + L.paid + '</span><b>' + q.amount + ' ' + q.sym + '</b><span>' + L.receipt + '</span><b><a href="https://solscan.io/tx/' + sig + '" target="_blank" rel="noopener">' + shortAddr(sig) + '</a></b></div>' +
      '<button class="go" type="button" id="shX">' + L.done + '</button>');
    $('shX').onclick = closeDlg; if (state === 'garage') renderGarage();
  } catch (e) { console.warn(e); fail(L.genericErr); } finally { shopBusy = false; }
}

      const id = x.memo.slice(SHOP.prefix.length), prod = PRODUCTS[id]; if (!prod || !prod.restorable) continue;
      const worth = x.sym === 'USDC' ? x.amount : (prices[x.sym] ? x.amount * prices[x.sym] : null), floor = x.sym === 'USDC' ? prod.usd * .95 * (1 - SHOP.skrDiscount) : prod.usd * .4 * (1 - SHOP.skrDiscount);

    }

$('segLang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.v; store.set('bullrun_lang', lang); applyLang(); });
$('segGas').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; autoGas = b.dataset.v === 'auto'; store.set('bullrun_gas', autoGas ? 'auto' : 'manual'); applyLang(); setUI(); });
$('segSnd').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; muted = b.dataset.v === 'off'; store.set('bullrun_mute', muted ? '1' : '0'); if (!muted) audioStart(); else engineTick(false); applyLang(); });
$('goTracks').addEventListener('click', () => { audioStart(); go('tracks'); });
$('goEndless').addEventListener('click', () => startRace({ endless: true }));
$('tGarage').addEventListener('click', openGarage);
$('tLb').addEventListener('click', openLb);
$('tShop').addEventListener('click', openShop);
$('tSet').addEventListener('click', () => go('settings'));
$('walletBtn').addEventListener('click', openWallet);
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', () => { if (state === 'garage') { equipValid(); toMenu(); } else go('home'); }));
$('quit').addEventListener('click', () => toMenu(mode === 'track' ? 'tracks' : 'home'));
$('restart').addEventListener('click', () => startRace(mode === 'track' ? { track: TRACKS.indexOf(TR) } : { endless: true }));
$('resume').addEventListener('click', resume);
$('pauseBtn').addEventListener('click', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', () => releaseAll());
addEventListener('resize', resize);
if (ONLINE && 'serviceWorker' in navigator && location.hostname === OWN_HOST) navigator.serviceWorker.register('sw.js').catch(() => {});

/* adaptive quality: drop bloom, then resolution, then shadows if the phone struggles */
const perf = { t: 0, n: 0, reset(){ this.t = 0; this.n = 0; } };
function perfCheck(dt){
  if (state !== 'race') return;
  perf.t += dt; perf.n++;
  if (perf.t > 3) {
    const avg = perf.t / perf.n; perf.reset();
    if (avg > 1 / 45) {
      if (useBloom) useBloom = false;
      else if (quality === 2) { quality = 1; resize(); }
      else if (renderer.shadowMap.enabled) { renderer.shadowMap.enabled = false; player.castShadow = false; }
    }
  }
}

/* ================= boot ================= */
resize();
toMenu();
applyLang();
if (WAL.addr && ONLINE) checkHolder(false);
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('italic 900 40px Saira'), document.fonts.load('italic 800 20px Saira')]).then(redrawTextTextures).catch(() => {});
window.__bullrun = { get info(){ return renderer.info.render.calls + ' calls ' + renderer.info.render.triangles + ' tris'; }, get state(){ return state; }, get raceT(){ return raceT; }, get result(){ return result; },
  jump(x){ sP = x; }, start: startRace, garage: openGarage, go, set bot(x){ bot = x; }, set autoGas(x){ autoGas = x; }, setPar(arr){ arr.forEach((p, i) => TRACKS[i].par = p); },
  sim(sec){ for (let i = 0; i < sec * 60; i++) { if (state !== 'paused' && state !== 'over') update(1 / 60); } },
  simUntilOver(maxSec){ let i = 0; while (state !== 'over' && i < maxSec * 60) { update(1 / 60); if (state === 'ending') { endT = 0; update(1 / 60); } i++; } return result; },
  gcam(x){ GCAM = x; }, paint(id){ showPaint(id); }, cam(b, h, la, ly){ CAMP = [b, h, la, ly]; }, camL(b, h, la, ly){ CAMP_L = [b, h, la, ly]; } };
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  if (state !== 'paused' && state !== 'over') update(dt);
  render(dt); hud(); perfCheck(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
</body></html>
